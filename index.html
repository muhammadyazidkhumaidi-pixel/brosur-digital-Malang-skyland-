.btn.alt{background:var(--soft);color:var(--brand)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--bg)}
.card img,.card .ph{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.card .ph{display:grid;place-items:center;background:var(--soft);color:var(--brand);font-weight:700;font-size:22px}
.card div.t{padding:8px 10px 10px}.card b{font-size:14px}.card p{margin:2px 0 0;font-size:12px;color:var(--muted);line-height:1.35}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}
